<!DOCTYPE html>
<html>
<head>
  <title>Signup Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Signup</h1>

<form onsubmit="return validateForm()">

  <h3>Personal Information</h3>

  Full name:<br>
  <input type="text" id="fullname" onblur="validateForm()">
  <span id="nameError"></span><br><br>

  Birthdate:<br>
  <input type="date" id="birthday">
  <span id="bdayError"></span><br><br>

  Sex:<br>
  <input type="radio" name="sex" value="Male"> Male
  <input type="radio" name="sex" value="Female"> Female
  <span id="sexError"></span><br><br>

  Email:<br>
  <input type="email" id="email">
  <span id="emailError"></span><br><br>

  <h3>Account Details</h3>

  Username:<br>
  <input type="text" id="username">
  <span id="userError"></span><br><br>

  Password:<br>
  <input type="password" id="pwd">
  <span id="passError"></span><br><br>

  Confirm Password:<br>
  <input type="password" id="cpwd">
  <span id="cpassError"></span><br><br>
  
  <h3>Preferences</h3>

  Favorite Topic: <br>
  <select id="topic">
    <option value="">-- choose --</option>
    <option value="html">HTML</option>
    <option value="css">CSS</option>
    <option value="js">JavaScript</option>
  </select>
  <span id="topicError"></span><br><br>

  What do you support? <br>
  <input type="checkbox" name="advocacy" value="equality"> Equality
  <input type="checkbox" name="advocacy" value="rights"> Rights
  <input type="checkbox" name="advocacy" value="stereotypes"> Remove stereotypes
  <span id="checkError"></span><br><br>

  Experience Level:<br>
  <input type="radio" name="level" value="beginner"> Beginner
  <input type="radio" name="level" value="intermediate"> Intermediate
  <input type="radio" name="level" value="advanced"> Advanced
  <span id="levelError"></span><br><br>

  <button type="submit">Join Our Community</button>

</form>

<p id="successMsg"></p>

</body>
<script src="script.js"></script>
</html>
